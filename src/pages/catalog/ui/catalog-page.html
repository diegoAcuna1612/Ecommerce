<div class="max-w-7xl mx-auto px-4 py-8">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-ink">Catálogo de Productos</h1>
        <p class="text-muted text-sm mt-1">Explora nuestra selección exclusiva de tecnología y accesorios.</p>
      </div>
      
      @if (productService.products().length > 0) {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          @for (prod of productService.products(); track prod.id) {
            <app-product-card 
              [product]="prod" 
              (addToCart)="handleAddToCart($event)" 
            />
          }
        </div>
      } @else {
        <div class="text-center py-12 text-muted">
          <p>Cargando catálogo de productos...</p>
        </div>
      }

    </div>
