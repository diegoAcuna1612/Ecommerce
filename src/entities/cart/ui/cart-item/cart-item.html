<div class="flex items-center gap-3 border-b border-line py-3">

<div class="relative w-14 h-14 bg-surface-hover rounded-lg overflow-hidden flex-shrink-0 border border-line">
    <img 
    [src]="item().product.image_url" 
    [alt]="item().product.title"
    class="w-full h-full object-cover"
    >
</div>

<div class="flex-grow min-w-0">
    <p class="font-medium text-sm text-ink truncate">{{ item().product.title }}</p>
    <p class="text-xs text-muted">Cant: {{ item().quantity }}</p>
</div>

<div class="text-right flex-shrink-0">
    <p class="font-bold text-sm text-ink">${{ (item().product.price * item().quantity).toFixed(2) }}</p>
</div>

</div>
