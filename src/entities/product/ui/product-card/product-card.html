<div class="card-clean group flex flex-col justify-between">

  <div class="relative h-56 bg-surface-hover overflow-hidden">
    <img 
      [src]="product().image" 
      [alt]="product().name" 
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    >
    
    <span class="absolute top-3 left-3 bg-surface/90 backdrop-blur-xs text-ink text-xs font-semibold px-3 py-1 rounded-full shadow-xs">
      {{ product().category }}
    </span>

    @if (product().stock > 0) {
      <span class="absolute top-3 right-3 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
        Stock: {{ product().stock }}
      </span>
    } @else {
      <span class="absolute top-3 right-3 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
        Agotado
      </span>
    }
  </div>

  <div class="p-5 flex flex-col flex-grow justify-between">
    
    <div>
      <h3 class="font-bold text-ink text-base line-clamp-1 group-hover:text-accent transition-colors">
        {{ product().name }}
      </h3>

      @if (product().description) {
        <p class="text-muted text-xs mt-1.5 line-clamp-2 leading-relaxed">
          {{ product().description }}
        </p>
      }
    </div>

    <div class="mt-5 pt-4 border-t border-line flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] text-muted block uppercase font-medium tracking-wider">Precio</span>
        <span class="text-xl font-black text-ink">\${{ product().price.toFixed(2) }}</span>
      </div>


      <div class="mt-auto">
        <ng-content></ng-content>
      </div>
      
    </div>

  </div>

</div>
