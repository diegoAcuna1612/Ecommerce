<div class="product-card">
  <img [src]="imagen" [alt]="nombre" class="product-card__image" />

  <div class="product-card__body">
    <h3 class="product-card__name">{{nombre}}</h3>
    <p class="product-card__price">{{precio}}</p>
    <p>{{retornarStock()}}</p>

    <button class="product-card__button" (click)="agregarAlCarrito()">
      Agregar al carrito
    </button>
  </div>
</div>
