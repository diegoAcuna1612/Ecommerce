<div class="max-w-7xl mx-auto px-4 py-8">
      
      <!-- Encabezado de la página -->
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900">Catálogo de Productos</h1>
        <p class="text-gray-500 text-sm mt-1">Explora nuestra selección exclusiva de tecnología y accesorios.</p>
      </div>
      
      <!-- Grid de Productos (Se alimenta reactivamente del servicio) -->
      @if (productService.products().length > 0) {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          @for (prod of productService.products(); track prod.id) {
            <app-product-card 
              [product]="prod" 
              (addToCart)="handleAddToCart($event)" 
            />
          }
        </div>
      } @else {
        <!-- Estado de carga o vacío opcional -->
        <div class="text-center py-12 text-gray-400">
          <p>Cargando productos...</p>
        </div>
      }

    </div>
